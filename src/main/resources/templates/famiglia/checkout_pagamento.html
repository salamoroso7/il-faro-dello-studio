<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%); color: white; min-height: 100vh; }
        .sidebar .nav-link { color: rgba(255,255,255,0.85); padding: 15px 20px; margin: 0 10px; border-radius: 5px; transition: all 0.3s; }
        .sidebar .nav-link:hover { background-color: rgba(255,255,255,0.2); color: white; transform: translateX(5px); }
        .sidebar .nav-link.active { background-color: white; color: #0d6efd; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show p-0">
            <div class="p-3 text-white fw-bold d-flex align-items-center mb-4 mt-2">
                <i class="fas fa-book-open fa-2x me-2"></i>
                <span class="fs-6">Il Faro - Famiglia</span>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link" href="dashboard_famiglia.html"><i class="fas fa-home me-2"></i> Riepilogo</a></li>
                <li class="nav-item mb-1"><a class="nav-link active" href="lista_pagamenti.html"><i class="fas fa-credit-card me-2"></i> Pagamenti</a></li>
                <li class="nav-item mt-5 pt-5 border-top border-light"><a class="nav-link text-white" href="index.html" style="opacity: 0.9;"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <h3 class="mb-4 text-center">Checkout Sicuro</h3>
                    <div class="card shadow border-0">
                        <div class="card-header bg-white border-bottom p-3">
                            <h5 class="mb-0 text-muted">Riepilogo Ordine</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fw-bold">Rata Iscrizione 2026 - Gennaio</span>
                                <span class="fw-bold text-primary">€ 150,00</span>
                            </div>
                            <h6 class="mb-3">Metodo di Pagamento</h6>
                            <form onsubmit="event.preventDefault(); alert('Pagamento effettuato con successo!'); window.location.href='lista_pagamenti.html';">
                                <div class="mb-3">
                                    <label class="form-label small text-muted">Intestatario Carta</label>
                                    <input type="text" class="form-control" placeholder="Mario Rossi" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small text-muted">Numero Carta</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-credit-card"></i></span>
                                        <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3"><label class="form-label small text-muted">Scadenza</label><input type="text" class="form-control" placeholder="MM/YY" required></div>
                                    <div class="col-6 mb-3"><label class="form-label small text-muted">CVV</label><input type="text" class="form-control" placeholder="123" required></div>
                                </div>
                                <div class="d-grid mt-4"><button type="submit" class="btn btn-success btn-lg shadow-sm">Paga € 150,00</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="text-center mt-5 text-muted small">
                &copy; 2025 Il Faro dello Studio
            </footer>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

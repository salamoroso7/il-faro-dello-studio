<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Registra studente - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
	<style>
		body {
			background-color: #f8f9fa;
		}

		.register-card {
			border: none;
			border-radius: 12px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
		}
	</style>
</head>

<body>

	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar Famiglia -->
			<th:block th:replace="~{fragments/famiglia-sidebar :: famiglia-sidebar('registra_studente')}" />

			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
				<div
					class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
					<h1 class="h2 text-primary fw-bold">Registra Studente</h1>
				</div>

				<p class="text-muted mb-4">Inserisci i dati dello studente per creare un nuovo account collegato alla
					tua famiglia.</p>

				<div class="row justify-content-center">
					<div class="col-lg-8">
						<div class="card register-card bg-white p-4">
							<h4 class="mb-4 fw-bold">Dati Anagrafici</h4>
							<form th:action="@{/register}" method="post">
								<div class="row g-3">

									<div th:if="${error}" class="col-12">
										<div class="alert alert-danger alert-dismissible fade show" role="alert">
											<span th:text="${error}">Errore generico</span>
											<button type="button" class="btn-close" data-bs-dismiss="alert"
												aria-label="Close"></button>
										</div>
									</div>

									<div class="col-md-6">
										<label class="form-label text-secondary small fw-bold">NOME</label>
										<input name="nome" th:value="${nome}"
											class="form-control form-control-lg bg-light border-0" required type="text"
											placeholder="Es. Mario">
									</div>

									<div class="col-md-6">
										<label class="form-label text-secondary small fw-bold">COGNOME</label>
										<input name="cognome" th:value="${cognome}"
											class="form-control form-control-lg bg-light border-0" required type="text"
											placeholder="Es. Rossi">
									</div>

									<div class="col-12">
										<label class="form-label text-secondary small fw-bold">EMAIL</label>
										<input name="codice-fiscale" th:value="${codiceFiscale}"
											class="form-control form-control-lg bg-light border-0" required type="email"
											placeholder="email@esempio.com">
										<div class="form-text">Questa email verrà utilizzata come username per
											l'accesso.</div>
									</div>

									<div class="col-12 d-none" id="materiaField">
										<label class="form-label text-secondary small fw-bold">DATA DI NASCITA</label>
										<input name="data-nascita" th:value="${dataNascita}"
											class="form-control form-control-lg bg-light border-0" type="date">
									</div>

									<div class="col-12 mt-4">
										<button class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm"
											type="submit">
											<i class="fas fa-save me-2"></i> REGISTRA ACCOUNT
										</button>
									</div>
								</div>
							</form>
						</div>
					</div>

				</div>
			</main>
		</div>
	</div>
</body>

</html>

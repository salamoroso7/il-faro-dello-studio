<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registra studente - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
	<style>
		body {
			background-color: #f8f9fa;
		}
	</style>
</head>

<body>
	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar Famiglia -->
			<th:block th:replace="~{fragments/famiglia-sidebar :: famiglia-sidebar('registra_studente')}" />

			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column">
				<div
					class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
					<h1 class="h2">Registra Studente</h1>
				</div>

				<div class="row justify-content-center">
					<div class="col-lg-10">
						<div class="card shadow-sm">
							<div class="card-body p-4">
								<h3 class="text-primary fw-bold mb-4">Iscrivi uno studente</h3>
								<p class="text-muted mb-4">Compila il modulo sottostante per iscrivere un nuovo studente
									alla piattaforma.</p>

								<form th:action="@{/famiglia/registrazione-studente}" method="post">
									<div class="row g-3">

										<div th:if="${error}" class="col-12">
											<div class="alert alert-danger alert-dismissible fade show" role="alert">
												<span th:text="${error}"></span>
												<button type="button" class="btn-close" data-bs-dismiss="alert"
													aria-label="Close"></button>
											</div>
										</div>

										<div th:if="${success}" class="col-12">
											<div class="alert alert-success">
												<h5 class="alert-heading"><i
														class="fas fa-check-circle me-2"></i>Registrazione Completata!
												</h5>
												<p th:text="${success}"></p>
												<hr>
												<p class="mb-1"><strong>Email:</strong> <span class="badge bg-dark"
														th:text="${emailGenerata}"></span></p>
												<p class="mb-0"><strong>Password:</strong> <span class="badge bg-dark"
														th:text="${passwordGenerata}"></span></p>
												<div class="mt-2">
													<small class="text-muted italic">Copia queste credenziali prima di
														ricaricare la pagina.</small>
												</div>
											</div>
										</div>

										<div class="col-md-6">
											<label class="form-label text-muted small fw-bold">NOME</label>
											<input name="nome" th:value="${studenteDto?.nome}"
												class="form-control bg-light" required type="text">
										</div>

										<div class="col-md-6">
											<label class="form-label text-muted small fw-bold">COGNOME</label>
											<input name="cognome" th:value="${studenteDto?.cognome}"
												class="form-control bg-light" required type="text">
										</div>

										<div class="col-12">
											<label class="form-label text-muted small fw-bold">CODICE FISCALE</label>
											<input name="codiceFiscale" th:value="${studenteDto?.codiceFiscale}"
												class="form-control bg-light" required type="text">
										</div>

										<div class="col-12">
											<label class="form-label text-muted small fw-bold">DATA DI NASCITA</label>
											<input name="dataNascita" th:value="${studenteDto?.dataNascita}"
												class="form-control bg-light" required type="date">
										</div>

										<div class="col-12 mt-4">
											<div class="d-flex justify-content-end gap-2">
												<a th:href="@{/famiglia/dashboard-famiglia}"
													class="btn btn-outline-secondary">Annulla</a>
												<button class="btn btn-primary fw-bold px-4" type="submit">
													<i class="fas fa-save me-2"></i> REGISTRA
												</button>
											</div>
										</div>

									</div>
								</form>
							</div>
						</div>
					</div>
				</div>

				<th:block th:replace="~{fragments/footer :: standardFooter}" />
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

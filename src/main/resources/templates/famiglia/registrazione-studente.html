<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Registra studente - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }

        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .left-panel {
            background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            border-radius: 15px 0 0 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        /* Mobile adjustment */
        @media (max-width: 768px) {
            .left-panel {
                border-radius: 15px 15px 0 0;
                padding: 20px;
            }
        }
	</style>
</head>
<body>

<div class="container">
	<div class="row justify-content-center">
		<div class="col-lg-10">
			<div class="card register-card">
				<div class="row g-0">

					<div class="col-md-5 left-panel">
						<i class="fas fa-user-plus fa-4x mb-4"></i>
						<h3 class="fw-bold">Iscrivi uno studente alla piattaforma</h3>
						<p class="opacity-75 mb-4">Iscrivi uno studente alla piattaforma per accedere alle varie attività
							dedicati.</p>
					</div>

					<div class="col-md-7 bg-white p-5 rounded-end">
						<h3 class="text-primary fw-bold mb-4">Crea Account</h3>

						<form th:action="@{/famiglia/registrazione-studente}" method="post">
							<div class="row g-3">

								<div th:if="${error}" class="col-12">
									<div class="alert alert-danger alert-dismissible fade show" role="alert">
										<span th:text="${error}"></span>
										<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
									</div>
								</div>

								<div th:if="${success}" class="col-12">
									<div class="alert alert-success">
										<h5 class="alert-heading"><i class="fas fa-check-circle me-2"></i>Registrazione Completata!</h5>
										<p th:text="${success}"></p>
										<hr>
										<p class="mb-1"><strong>Email:</strong> <span class="badge bg-dark" th:text="${emailGenerata}"></span></p>
										<p class="mb-0"><strong>Password:</strong> <span class="badge bg-dark" th:text="${passwordGenerata}"></span></p>
										<div class="mt-2">
											<small class="text-muted italic">Copia queste credenziali prima di ricaricare la pagina.</small>
										</div>
									</div>
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">NOME</label>
									<input name="nome" th:value="${studenteDto?.nome}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">COGNOME</label>
									<input name="cognome" th:value="${studenteDto?.cognome}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-12">
									<label class="form-label text-muted small fw-bold">CODICE FISCALE</label>
									<input name="codiceFiscale" th:value="${studenteDto?.codiceFiscale}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-12">
									<label class="form-label text-muted small fw-bold">DATA DI NASCITA</label>
									<input name="dataNascita" th:value="${studenteDto?.dataNascita}" class="form-control bg-light" required type="date">
								</div>

								<div class="col-12 mt-4">
									<button class="btn btn-primary w-100 py-2 fw-bold shadow-sm" type="submit">
										<i class="fas fa-save me-2"></i> REGISTRA STUDENTE
									</button>
								</div>

							</div>
						</form>
					</div>
				</div>
			</div>

			<div class="text-center mt-4">
				<form th:action="@{/famiglia/dashboard-famiglia}" method="get" class="m-0">
					<button type="submit" class="nav-link nav-link-btn">
						<i class="fas fa-home me-2"></i> Torna alla dashboard
					</button>
				</form>
			</div>

		</div>
	</div>
</div>
</body>
</html>

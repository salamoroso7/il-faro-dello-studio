<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Famiglia - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Famiglia -->
            <th:block th:replace="~{fragments/famiglia-sidebar :: famiglia-sidebar('dashboard')}" />

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column">
                <h2 class="text-primary fw-bold mb-4">
                    Benvenuto, <span th:text="${famiglia?.nome ?: 'Ospite'}"></span>
                </h2>

                <div class="alert alert-warning border-start border-warning border-4" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Hai <strong>1 pagamento in sospeso</strong>. La mancata regolarizzazione blocca l'iscrizione alle
                    attività dello studente.
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card text-white bg-primary h-100 shadow-sm border-0">
                            <div class="card-body p-4">
                                <h5>Stato Contabile</h5>
                                <p class="fs-4 mb-0">1 Scadenza Imminente</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card text-white bg-success h-100 shadow-sm border-0">
                            <div class="card-body p-4">
                                <h5>Ultimo Pagamento</h5>
                                <p class="fs-4 mb-0">€ 45,00 (15/12/2025)</p>
                            </div>
                        </div>
                    </div>
                </div>
                <th:block th:replace="~{fragments/footer :: standardFooter}" />

            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

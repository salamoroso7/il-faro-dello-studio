<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Famiglia - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Famiglia -->
            <th:block th:replace="~{fragments/famiglia-sidebar :: famiglia-sidebar('dashboard')}" />

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column">
                <h2 class="text-primary fw-bold mb-4">
                    Benvenuto, <span th:text="${famiglia?.nome ?: 'Ospite'}"></span>
                </h2>
                <th:block th:replace="~{fragments/footer :: standardFooter}" />

            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

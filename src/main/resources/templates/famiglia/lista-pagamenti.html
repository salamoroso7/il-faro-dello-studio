<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Pagamenti - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            min-height: 100vh;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .sidebar .nav-link-btn {
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .sidebar .nav-link-btn:focus {
            outline: none;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background-color: white;
            color: #0d6efd;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
	</style>
</head>
<body>
<div class="container-fluid">
	<div class="row">
		<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show p-0">
			<div class="p-3 text-white fw-bold d-flex align-items-center mb-4 mt-2">
				<i class="fas fa-book-open fa-2x me-2"></i>
				<span class="fs-6">Il Faro - Famiglia</span>
			</div>
			<ul class="nav flex-column">
				<li class="nav-item mb-1">
					<form class="m-0" method="get" th:action="@{/famiglia/dashboard-famiglia}">
						<button class="nav-link nav-link-btn" type="submit">
							<i class="fas fa-home me-2"></i> Riepilogo
						</button>
					</form>
				</li>
				<li class="nav-item mb-1">
					<form class="m-0" method="get" th:action="@{/famiglia/lista-pagamenti}">
						<button class="nav-link nav-link-btn" type="submit">
							<i class="fas fa-credit-card me-2"></i> Pagamenti
						</button>
					</form>
				</li>
				<li class="nav-item mb-1">
					<form class="m-0" method="post" th:action="@{/logout}">
						<button class="nav-link nav-link-btn" type="submit">
							<i class="fas fa-sign-out-alt me-2"></i> Logout
						</button>
					</form>
				</li>
			</ul>
		</nav>

		<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
			<h2 class="text-primary fw-bold mb-4">Gestione Pagamenti e Tasse</h2>

			<div class="card shadow border-0">
				<div class="card-body p-0">
					<table class="table table-hover align-middle mb-0">
						<thead class="bg-light">
						<tr>
							<th class="p-3">Causale</th>
							<th>Scadenza</th>
							<th>Importo</th>
							<th>Stato</th>
							<th class="text-end p-3">Azioni</th>
						</tr>
						</thead>
						<tbody>
						<tr>
							<td class="p-3 fw-bold">Rata Iscrizione 2026 - Gennaio</td>
							<td>31/01/2026</td>
							<td class="fw-bold">€ 150,00</td>
							<td><span class="badge bg-danger rounded-pill">Non Pagato</span></td>
							<td class="text-end p-3">
                              <form th:action="@{/famiglia/checkout-pagamento}" method="get" class="d-inline m-0">
                                <!--
                                <input type="hidden" name="idPagamento" th:value="${pagamento.id}">
                                -->

                                <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                                  Paga Ora <i class="fas fa-arrow-right ms-1"></i>
                                </button>
                              </form>
							</td>
						</tr>
						<tr>
							<td class="p-3 fw-bold">Materiale Didattico</td>
							<td>15/12/2025</td>
							<td class="fw-bold">€ 45,00</td>
							<td><span class="badge bg-success rounded-pill">Saldato</span></td>
							<td class="text-end p-3">
								<button class="btn btn-outline-secondary btn-sm rounded-pill"
										onclick="alert('Download PDF ricevuta...')"><i class="fas fa-download me-1"></i>
									Ricevuta
								</button>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
			<footer class="text-center mt-5 text-muted small">
				&copy; 2025 Il Faro dello Studio
			</footer>
		</main>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

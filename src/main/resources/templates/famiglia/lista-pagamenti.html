<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Pagamenti - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
	<style>
		body {
			background-color: #f8f9fa;
		}
	</style>
</head>

<body>
	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar Famiglia -->
			<th:block th:replace="~{fragments/famiglia-sidebar :: famiglia-sidebar('pagamenti')}" />

			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column">
				<h2 class="text-primary fw-bold mb-4">Gestione Pagamenti e Tasse</h2>

				<div class="card shadow border-0">
					<div class="card-body p-0">
						<table class="table table-hover align-middle mb-0">
							<thead class="bg-light">
								<tr>
									<th class="p-3">Causale</th>
									<th>Scadenza</th>
									<th>Importo</th>
									<th>Stato</th>
									<th class="text-end p-3">Azioni</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td class="p-3 fw-bold">Rata Iscrizione 2026 - Gennaio</td>
									<td>31/01/2026</td>
									<td class="fw-bold">€ 150,00</td>
									<td><span class="badge bg-danger rounded-pill">Non Pagato</span></td>
									<td class="text-end p-3">
										<form th:action="@{/famiglia/checkout-pagamento}" method="get"
											class="d-inline m-0">
											<!--
                                <input type="hidden" name="idPagamento" th:value="${pagamento.id}">
                                -->

											<button type="submit"
												class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
												Paga Ora <i class="fas fa-arrow-right ms-1"></i>
											</button>
										</form>
									</td>
								</tr>
								<tr>
									<td class="p-3 fw-bold">Materiale Didattico</td>
									<td>15/12/2025</td>
									<td class="fw-bold">€ 45,00</td>
									<td><span class="badge bg-success rounded-pill">Saldato</span></td>
									<td class="text-end p-3">

									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<th:block th:replace="~{fragments/footer :: standardFooter}" />

			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

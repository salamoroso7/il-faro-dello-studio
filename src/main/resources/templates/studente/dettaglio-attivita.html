<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Dettaglio Attività - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
	<style>
        body {
            background-color: #f8f9fa;
        }
	</style>
</head>
<body>
<div class="container-fluid">
	<div class="row">

		<!-- Sidebar Studente -->
		<th:block th:replace="~{fragments/studente-sidebar :: studente-sidebar('dettaglio_attivita')}" />

		<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

			<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
				<i class="fas fa-check-circle me-2"></i>
				<span th:text="${success}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>

			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="fas fa-exclamation-triangle me-2"></i>
				<span th:text="${error}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>

			<div class="card shadow border-0" th:if="${attivita != null}">
				<div class="card-header bg-primary text-white p-4">
					<div class="d-flex justify-content-between align-items-center">
						<h2 class="h3 mb-0" th:text="${attivita.titolo}">Titolo Attività</h2>
						<span class="badge bg-light text-primary fs-6">
                    		<span th:text="${attivita.getPostiRimanenti()}">0</span> Posti Rimanenti
                		</span>
					</div>
				</div>

				<div class="card-body p-4">
					<div class="row">
						<div class="col-md-8">
							<h5 class="text-primary fw-bold">Descrizione</h5>
							<p th:text="${attivita.descrizione}">Descrizione dell'attività...</p>

							<h5 class="text-primary fw-bold mt-4">Materia</h5>
							<p th:text="${attivita.materia.nome}">Nome Materia</p>
						</div>

						<div class="col-md-4">
							<div class="card bg-light border-0">
								<div class="card-body">
									<h6 class="fw-bold">Dettagli</h6>
									<hr>
									<p class="mb-2">
										<i class="fas fa-calendar me-2 text-muted"></i>
										<span th:text="${#temporals.format(attivita.data, 'dd MMMM yyyy')}">Data</span>
									</p>
									<p class="mb-2">
										<i class="fas fa-clock me-2 text-muted"></i>
										<span th:text="${attivita.oraInizio} + ' - ' + ${attivita.oraFine}">00:00 - 00:00</span>
									</p>
									<p class="mb-2">
										<i class="fas fa-user me-2 text-muted"></i>
										<span th:text="'Prof. ' + ${attivita.docente.nome} + ' ' + ${attivita.docente.cognome}">Docente</span>
									</p>
									<hr>

									<div class="d-grid">
										<form th:action="@{/studente/iscriviti-attivita}" method="post">
											<input type="hidden" name="id" th:value="${attivita.idAttivita}">

											<button type="submit" class="btn btn-success btn-lg w-100">
												Iscriviti
											</button>
										</form>
										<small class="text-muted text-center mt-2 d-block">*L'iscrizione richiede pagamenti regolari.</small>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

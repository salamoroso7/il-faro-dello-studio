<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Calendario Attività - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
	<style>
		body {
			background-color: #f8f9fa;
		}

		.lesson-card {
			transition: transform 0.2s;
			border: none;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}

		.lesson-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
		}
	</style>
</head>

<body>
	<div class="container-fluid">
		<div class="row">

			<!-- Sidebar Studente -->
			<th:block th:replace="~{fragments/studente-sidebar :: studente-sidebar('calendario_attivita')}" />

			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
				<h2 class="text-primary fw-bold mb-4">Calendario Attività Disponibili</h2>

				<div class="row g-4">
					<div class="col-md-6 col-lg-4" th:each="attivita : ${listaAttivita}">
						<div class="card lesson-card h-100">
							<div class="card-body">
								<div class="d-flex justify-content-between align-items-start mb-2">
									<span class="badge bg-info text-dark" th:text="${attivita.materia.nome}">Materia</span>
								</div>

								<h5 class="card-title fw-bold" th:text="${attivita.titolo}">Titolo Attività</h5>

								<p class="text-muted small mb-3">
									<i class="fas fa-user-tie me-1"></i>
									<span th:text="'Prof. ' + ${attivita.docente.nome} + ' ' + ${attivita.docente.cognome}">Docente</span>
								</p>

								<div class="d-flex justify-content-between align-items-center mt-4">
									<div>
										<div class="text-muted small mb-1">
											<i class="far fa-calendar-alt me-1"></i>
											<span th:text="${#temporals.format(attivita.data, 'dd MMMM yyyy')}">Data</span>
										</div>
										<small class="text-muted">
											<i class="far fa-clock me-1"></i>
											<span th:text="${attivita.oraInizio} + ' - ' + ${attivita.oraFine}">00:00 - 00:00</span>
										</small>
									</div>

									<form class="m-0" method="get" th:action="@{/studente/dettaglio-attivita}">
										<input type="hidden" name="id" th:value="${attivita.idAttivita}">
										<button class="btn btn-outline-primary btn-sm" type="submit">
											Dettagli
										</button>
									</form>
								</div>
							</div>
						</div>
					</div>

					<div class="col-12" th:if="${#lists.isEmpty(listaAttivita)}">
						<p class="text-center text-muted">Non ci sono attività disponibili al momento.</p>
					</div>
				</div>

				<th:block th:replace="~{fragments/footer :: standardFooter}" />
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Registrati - Il Faro dello Studio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }

        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .left-panel {
            background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            border-radius: 15px 0 0 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        /* Mobile adjustment */
        @media (max-width: 768px) {
            .left-panel {
                border-radius: 15px 15px 0 0;
                padding: 20px;
            }
        }
	</style>
</head>
<body>

<div class="container">
	<div class="row justify-content-center">
		<div class="col-lg-10">
			<div class="card register-card">
				<div class="row g-0">

					<div class="col-md-5 left-panel">
						<i class="fas fa-user-plus fa-4x mb-4"></i>
						<h3 class="fw-bold">Unisciti a Noi</h3>
						<p class="opacity-75 mb-4">Crea il tuo account per accedere a lezioni, feedback e servizi
							dedicati.</p>
						<a class="btn btn-outline-light rounded-pill px-4" href="login.html">Hai già un account?
							Accedi</a>
					</div>

					<div class="col-md-7 bg-white p-5 rounded-end">
						<h3 class="text-primary fw-bold mb-4">Crea Account</h3>

						<form th:action="@{/register}" method="post">
							<div class="row g-3">

								<div th:if="${error}" class="col-12">
									<div class="alert alert-danger alert-dismissible fade show" role="alert">
										<span th:text="${error}">Errore generico</span>
										<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
									</div>
								</div>

								<div class="col-12">
									<label class="form-label text-muted small fw-bold">SELEZIONA RUOLO</label>
									<select name="ruolo" class="form-select bg-light" id="roleSelect" onchange="toggleFields()"
											required>
										<option disabled th:selected="${ruolo == null}" value="">Chi sei?</option>
										<option value="docente" th:selected="${ruolo == 'docente'}">Docente</option>
										<option value="famiglia" th:selected="${ruolo == 'famiglia'}">Famiglia</option>
									</select>
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">NOME</label>
									<input name="nome" th:value="${nome}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">COGNOME</label>
									<input name="cognome" th:value="${cognome}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-12">
									<label class="form-label text-muted small fw-bold">EMAIL</label>
									<input name="email" th:value="${email}" class="form-control bg-light" placeholder="nome@esempio.it" required
										   type="email">
								</div>

								<div class="col-12">
									<label class="form-label text-muted small fw-bold">USERNAME</label>
									<input name="username" th:value="${username}" class="form-control bg-light" required type="text">
								</div>

								<div class="col-12 d-none" id="materiaField">
									<label class="form-label text-muted small fw-bold">MATERIA</label>
									<input name="materia" th:value="${materia}" class="form-control bg-light" type="text">
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">PASSWORD</label>
									<input name="password" class="form-control bg-light" required type="password">
								</div>

								<div class="col-md-6">
									<label class="form-label text-muted small fw-bold">CONFERMA PASSWORD</label>
									<input name="conferma_password" class="form-control bg-light" required type="password">
								</div>

								<div class="col-12 mt-4">
									<div class="form-check">
										<input class="form-check-input" required type="checkbox">
										<label class="form-check-label small text-muted">
											Accetto i Termini di Servizio e la Privacy Policy
										</label>
									</div>
								</div>

								<div class="col-12 mt-3">
									<button class="btn btn-primary w-100 py-2 fw-bold shadow-sm" type="submit">
										REGISTRATI
									</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div class="text-center mt-4">
				<a class="text-decoration-none text-muted" th:href="@{/}"><i class="fas fa-arrow-left me-2"></i>Torna
					alla Home Page</a>
			</div>

		</div>
	</div>
</div>

<script>
    function toggleFields() {
        const role = document.getElementById('roleSelect').value;
        const materiaField = document.getElementById('materiaField');

        // Mostra campo matricola solo se è studente
        if (role === 'docente') {
            materiaField.classList.remove('d-none');
        } else {
            materiaField.classList.add('d-none');
        }
    }
</script>

</body>
</html>

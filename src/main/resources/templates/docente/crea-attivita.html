<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Attività</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
    <style>
        /* Reset e Font di base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }

        /* La "Card" bianca centrale */
        .form-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            /* Slightly wider */
            margin: 0 auto;
            /* Center horizontally */
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Stile dei gruppi di input */
        .form-group {
            margin-bottom: 20px;
        }

        /* Override Bootstrap label if needed, or stick to custom */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        /* Stile dei campi di testo, data, ora e numero */
        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        select {
            height: 50px;
        }

        input:focus {
            border-color: #0d6efd;
            /* Bootstrap primary */
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }

        /* Disposizione affiancata per Data e Ora */
        .input-row {
            display: flex;
            gap: 15px;
        }

        .input-col {
            flex: 1;
        }

        /* Il Bottone */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #0d6efd;
            /* Bootstrap primary */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0b5ed7;
        }

        /* Messaggio di successo */
        .alert-success {
            margin-top: 20px;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Docente -->
            <th:block th:replace="~{fragments/docente-sidebar :: docente-sidebar('crea_attivita')}" />

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

                <div class="form-card">
                    <h1>Nuova Attività</h1>

                    <form th:action="@{/attivita/crea}" method="post">

                        <div class="form-group">
                            <label for="nome">Nome attività</label>
                            <input type="text" id="nome" name="nome" placeholder="Es. Esercizi di Algebra" required>
                        </div>

                        <div class="form-group">
                            <label for="descrizione">Descrizione</label>
                            <input type="text" id="descrizione" name="descrizione" placeholder="Es. Pagina 40-42"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="materia">Materia</label>
                            <select id="materia" name="materiaNome" required>
                                <option value="" disabled selected>Scegli una delle tue materie...</option>
                                <option th:each="m : ${materieDocente}" th:value="${m.nome}" th:text="${m.nome}">
                                    Matematica</option>
                            </select>
                        </div>

                        <div class="input-row">
                            <div class="input-col form-group">
                                <label for="data">Data</label>
                                <input type="date" id="data" name="data" required>
                            </div>
                            <div class="input-col form-group">
                                <label for="posti">Posti Disponibili</label>
                                <input type="number" id="posti" name="posti" min="1" max="25" value="1" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-col form-group">
                                <label for="ora">Ora Inizio</label>
                                <input type="time" id="ora" name="oraInizio" required>
                            </div>
                            <div class="input-col form-group">
                                <label for="oraFine">Ora Fine</label>
                                <input type="time" id="oraFine" name="oraFine" required>
                            </div>
                        </div>

                        <button type="submit">Crea Attività</button>
                    </form>

                    <div th:if="${success}" class="alert-success">
                        <span th:text="${success}"></span>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

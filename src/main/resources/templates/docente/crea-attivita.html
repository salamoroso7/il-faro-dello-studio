<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Attività</title>
    <style>
        /* Reset e Font di base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* La "Card" bianca centrale */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Stile dei gruppi di input */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        /* Stile dei campi di testo, data e ora */
        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box; /* Assicura che il padding non sballi la larghezza */
            transition: border-color 0.3s;
        }

        /* Effetto quando clicchi su un campo */
        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* Disposizione affiancata per Data e Ora */
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }

        /* Il Bottone */
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Messaggio di successo */
        .alert-success {
            margin-top: 20px;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            text-align: center;
        }

        /* Link per tornare indietro (opzionale) */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Nuova Attività</h1>

    <form th:action="@{/attivita/crea}" method="post">

        <div class="form-group">
            <label for="nome">Nome attività</label>
            <input type="text" id="nome" name="nome" placeholder="Es. Esercizi di Algebra" required>
        </div>

        <div class="form-group">
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" name="descrizione" placeholder="Es. Pagina 40-42" required>
        </div>

        <div class="form-group">
            <label for="materia">Materia</label>
            <input type="text" id="materia" name="materia" required>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="col form-group">
                <label for="ora">Ora Inizio</label>
                <input type="time" id="ora" name="ora" required>
            </div>
        </div>

        <button type="submit">Crea Attività</button>
    </form>

    <div th:if="${success}" class="alert-success">
        <span th:text="${success}"></span>
    </div>

</div>

</body>
</html>

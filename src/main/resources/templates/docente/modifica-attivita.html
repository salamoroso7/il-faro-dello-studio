<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Attività</title>
    <style>
        /* Reset e Font di base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* La "Card" centrale */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Gruppi di input */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        /* Stile campi input */
        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* Data e Ora affiancate */
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }

        /* Bottoni */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button, .btn-secondary {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        /* Bottone Principale (Salva) */
        button {
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* Bottone Secondario (Torna Indietro) */
        .btn-secondary {
            background-color: #e2e6ea;
            color: #495057;
            display: inline-block; /* Necessario perché è un tag <a> */
            box-sizing: border-box;
        }
        .btn-secondary:hover {
            background-color: #dbe0e5;
            color: #212529;
        }

        /* Messaggi Successo/Errore */
        .alert-success, .alert-error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Modifica Attività</h1>

    <form th:action="@{/attivita/modifica}" method="post">

        <input type="hidden" name="id" th:value="${attivita.idAttivita}">

        <div class="form-group">
            <label for="nome">Nome attività</label>
            <input type="text" id="nome" name="nome" th:value="${attivita.titolo}" required>
        </div>

        <div class="form-group">
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" name="descrizione" th:value="${attivita.descrizione}" required>
        </div>

        <div class="form-group">
            <label for="materia">Materia</label>
            <input type="text" id="materia" name="materia" th:value="${attivita.materia.nome}" required>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" th:value="${attivita.data}" required>
            </div>
            <div class="col form-group">
                <label for="ora">Ora</label>
                <input type="time" id="ora" name="ora" th:value="${attivita.oraInizio}" required>
            </div>
        </div>

        <div class="actions">
            <a th:href="@{/attivita/crea}" class="btn-secondary">Indietro</a>
            <button type="submit">Salva</button>
        </div>

    </form>

    <div th:if="${success}" class="alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert-error">
        <span th:text="${error}"></span>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Attività - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .form-control,
        .form-select {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }

        .btn-action {
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Docente -->
            <th:block th:replace="~{fragments/docente-sidebar :: docente-sidebar('mie_attivita')}" />

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/docente/gestione-attivita}" class="btn btn-link text-decoration-none p-0 me-3">
                        <i class="fas fa-arrow-left fa-lg text-primary"></i>
                    </a>
                    <h2 class="text-primary fw-bold mb-0">Modifica Attività</h2>
                </div>

                <div class="form-container">
                    <div class="card shadow-sm border-0 p-4">
                        <form th:action="@{/attivita/modifica}" method="post">
                            <input type="hidden" name="id" th:value="${attivita.idAttivita}">

                            <div class="row g-4">
                                <!-- Nome Attività -->
                                <div class="col-12">
                                    <label for="nome" class="form-label">Nome attività</label>
                                    <input type="text" id="nome" name="nome" class="form-control"
                                        th:value="${attivita.titolo}" placeholder="Es. Esercizi di Algebra" required>
                                </div>

                                <!-- Descrizione -->
                                <div class="col-12">
                                    <label for="descrizione" class="form-label">Descrizione</label>
                                    <textarea id="descrizione" name="descrizione" class="form-control" rows="3"
                                        th:text="${attivita.descrizione}" placeholder="Dettagli dell'attività..."
                                        required></textarea>
                                </div>

                                <!-- Materia -->
                                <div class="col-md-6">
                                    <label for="materia" class="form-label">Materia</label>
                                    <select id="materia" name="materia" class="form-select" required>
                                        <option th:each="m : ${materieDocente}" th:value="${m.nome}" th:text="${m.nome}"
                                            th:selected="${m.nome == attivita.materia.nome}">
                                            Matematica</option>
                                    </select>
                                </div>

                                <!-- Posti -->
                                <div class="col-md-6">
                                    <label for="posti" class="form-label">Posti Disponibili</label>
                                    <input type="number" id="posti" name="posti" class="form-control" min="1" max="50"
                                        th:value="${attivita.posti}" required>
                                </div>

                                <!-- Data -->
                                <div class="col-md-4">
                                    <label for="data" class="form-label">Data</label>
                                    <input type="date" id="data" name="data" class="form-control"
                                        th:value="${attivita.data}" required>
                                </div>

                                <!-- Ora Inizio -->
                                <div class="col-md-4">
                                    <label for="oraInizio" class="form-label">Ora Inizio</label>
                                    <input type="time" id="oraInizio" name="oraInizio" class="form-control"
                                        th:value="${attivita.oraInizio}" required>
                                </div>

                                <!-- Ora Fine -->
                                <div class="col-md-4">
                                    <label for="oraFine" class="form-label">Ora Fine</label>
                                    <input type="time" id="oraFine" name="oraFine" class="form-control"
                                        th:value="${attivita.oraFine}" required>
                                </div>

                                <!-- Azioni -->
                                <div class="col-12 d-flex gap-3 mt-4">
                                    <a th:href="@{/docente/gestione-attivita}"
                                        class="btn btn-outline-secondary btn-action flex-grow-1">
                                        Annulla
                                    </a>
                                    <button type="submit" class="btn btn-primary btn-action flex-grow-1">
                                        Salva Modifiche
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div th:if="${error}" class="alert alert-danger mt-4 mb-0 border-0 shadow-sm text-center">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Docente - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <th:block th:replace="~{fragments/sidebar-styles :: sidebar-styles}" />
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <th:block th:replace="~{fragments/docente-sidebar :: docente-sidebar('dashboard')}" />

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="text-primary fw-bold mb-4">
                Benvenuto, Prof. <span th:text="${docente?.cognome ?: 'Ospite'}"></span>
            </h2>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card text-white bg-primary h-100 shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">Attività in Programma</h5>
                                <i class="fas fa-calendar-alt fa-2x opacity-50"></i>
                            </div>
                            <p class="display-4 fw-bold mb-0 mt-3" th:text="${numeroAttivita}">0</p>
                            <small class="opacity-75">Lezioni future confermate</small>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-white h-100 shadow-sm border-0"
                         th:classappend="${mediaRecensioni >= 4.0} ? 'bg-success' : (${mediaRecensioni >= 2.5} ? 'bg-warning' : 'bg-danger')">

                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">Feedback Ricevuti</h5>
                                <i class="fas fa-star fa-2x opacity-50"></i>
                            </div>

                            <div class="mt-3">
                                <span class="display-4 fw-bold"
                                      th:text="${mediaRecensioni != null ? #numbers.formatDecimal(mediaRecensioni, 1, 1) : '0.0'}">
                                      0.0
                                </span>
                                <span class="fs-4">/ 5</span>
                            </div>

                            <small class="opacity-75">
                                Basato su <span th:text="${numeroRecensioni}">0</span> recensioni
                            </small>
                        </div>
                    </div>
                </div>

                <!--
                <div class="col-md-4">
                    <div class="card text-white bg-success h-100 shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">Studenti Iscritti</h5>
                                <i class="fas fa-users fa-2x opacity-50"></i>
                            </div>
                            <p class="display-4 fw-bold mb-0 mt-3" th:text="${totaleIscritti ?: 0}">0</p>
                            <small class="opacity-75">Totale iscrizioni alle tue lezioni</small>
                        </div>
                    </div>
                </div>
                -->

            </div>
            <footer class="text-center mt-5 text-muted small">
                &copy; 2025 Il Faro dello Studio
            </footer>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

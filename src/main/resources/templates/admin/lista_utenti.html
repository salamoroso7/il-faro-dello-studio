<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Il Faro dello Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        /* Sidebar Nera per Admin */
        .sidebar { background: linear-gradient(180deg, #212529 0%, #343a40 100%); color: white; min-height: 100vh; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 15px 20px; margin: 0 10px; border-radius: 5px; transition: all 0.3s; }
        .sidebar .nav-link:hover { background-color: rgba(255,255,255,0.1); color: white; }
        .sidebar .nav-link.active { background-color: #495057; color: white; font-weight: bold; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show p-0">
            <div class="p-3 text-white fw-bold d-flex align-items-center mb-4 mt-2">
                <i class="fas fa-cogs fa-2x me-2"></i>
                <span class="fs-6">Il Faro - Admin</span>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link active" href="#"><i class="fas fa-users me-2"></i> Gestione Utenti</a></li>
                <li class="nav-item mt-5 pt-5 border-top border-secondary"><a class="nav-link" href="index.html"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="fw-bold mb-4">Anagrafica Utenti</h2>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Ruolo</th>
                            <th>Email</th>
                            <th>Stato</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Mario Rossi</td>
                            <td><span class="badge bg-primary">Studente</span></td>
                            <td>mario.rossi@studenti.unisa.it</td>
                            <td><span class="badge bg-success">Attivo</span></td>
                            <td class="text-end"><button class="btn btn-sm btn-outline-danger">Banna</button></td>
                        </tr>
                        <tr>
                            <td>Luigi Verdi</td>
                            <td><span class="badge bg-warning text-dark">Docente</span></td>
                            <td>l.verdi@unisa.it</td>
                            <td><span class="badge bg-danger">Sospeso</span></td>
                            <td class="text-end"><button class="btn btn-sm btn-outline-success">Riattiva</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <footer class="text-center mt-5 text-muted small">
                &copy; 2025 Il Faro dello Studio
            </footer>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="sidebar-styles">
    <style>
        /* Sidebar Styles - Condivisi tra tutti i ruoli */
        .sidebar {
            background: linear-gradient(180deg, #212529 0%, #343a40 100%);
            color: white;
            min-height: 100vh;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 15px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .sidebar .nav-link-btn {
            background: none;
            border: none;
            width: calc(100% - 20px);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin: 0 10px;
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.75);
            transition: all 0.3s;
        }

        .sidebar .nav-link-btn:focus {
            outline: none;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link-btn.active {
            background-color: #495057;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

</html>

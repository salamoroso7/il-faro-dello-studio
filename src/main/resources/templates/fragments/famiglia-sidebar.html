<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="famiglia-sidebar(currentPage)" class="col-md-3 col-lg-2 d-md-block sidebar collapse show p-0">
        <div class="p-3 text-white fw-bold d-flex align-items-center mb-4 mt-2">
            <i class="fas fa-book-open fa-2x me-2"></i>
            <span class="fs-6">Il Faro - Famiglia</span>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item mb-1">
                <form th:action="@{/famiglia/dashboard-famiglia}" method="get" class="m-0">
                    <button type="submit" class="nav-link nav-link-btn"
                        th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                        <i class="fas fa-home me-2"></i> Riepilogo
                    </button>
                </form>
            </li>

            <li class="nav-item mb-1">
                <form th:action="@{/famiglia/registrazione-studente}" method="get" class="m-0">
                    <button type="submit" class="nav-link nav-link-btn"
                        th:classappend="${currentPage == 'registra_studente'} ? 'active' : ''">
                        <i class="fas fa-user-plus me-2"></i> Registra studente
                    </button>
                </form>
            </li>

            <li class="nav-item mb-1">
                <form th:action="@{/famiglia/lista-pagamenti}" method="get" class="m-0">
                    <button type="submit" class="nav-link nav-link-btn"
                        th:classappend="${currentPage == 'pagamenti'} ? 'active' : ''">
                        <i class="fas fa-credit-card me-2"></i> Pagamenti
                    </button>
                </form>
            </li>

            <li class="nav-item mb-1">
                <form th:action="@{/feedback/lascia}" method="get" class="m-0">
                    <button type="submit" class="nav-link nav-link-btn"
                            th:classappend="${currentPage == 'feedback'} ? 'active' : ''">
                        <i class="fas fa-comment-dots me-2"></i> Feedback Docenti
                    </button>
                </form>
            </li>

            <li class="nav-item mb-1">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="nav-link nav-link-btn">
                        <i class="fas fa-sign-out-alt me-2"></i> Logout
                    </button>
                </form>
            </li>
        </ul>
    </nav>
</body>

</html>

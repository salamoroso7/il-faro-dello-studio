spring.application.name=il-faro-dello-studio

# Datasource: valori presi dalle variabili caricate da spring-dotenv (DB_URL/DB_USER/DB_PWD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ilfarodellostudio?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Configurazione JPA / Hibernate
# Nota: queste impostazioni sono lasciate in application.properties perché raramente vanno cambiate in ambienti locali
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
